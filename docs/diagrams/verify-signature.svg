<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="840" viewBox="0 0 1200 840">
  <!--
    Orion family diagram template. Copy it, keep <defs> and <style>, replace the body.
    Classes: .step (our code) .ext (backend / external system) .ok (success end) .fail (failure path)
             .decision (diamond) .note (side remark) .lane (sequence lifeline)
    Arrows: class="flow" (main path), "flow alt" (alternate / failure path, dashed), "flow back" (response).
  -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-fail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <style>
    text { font-family: "Segoe UI", Inter, "Helvetica Neue", Arial, sans-serif; fill: #1e1b4b; }
    .title { font-size: 24px; font-weight: 700; }
    .subtitle { font-size: 14px; fill: #475569; }
    .label { font-size: 15px; font-weight: 600; }
    .small { font-size: 12.5px; fill: #475569; }
    .code { font-family: "Cascadia Code", Consolas, "SF Mono", monospace; font-size: 13px; fill: #3730a3; }
    .edge { font-size: 12.5px; fill: #334155; }
    .step { fill: #eef2ff; stroke: #4f46e5; stroke-width: 2; }
    .ext { fill: #f0f9ff; stroke: #0284c7; stroke-width: 2; }
    .ok { fill: #ecfdf5; stroke: #059669; stroke-width: 2; }
    .fail { fill: #fef2f2; stroke: #dc2626; stroke-width: 2; }
    .decision { fill: #fffbeb; stroke: #d97706; stroke-width: 2; }
    .note { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; stroke-dasharray: 4 3; }
    .lane { stroke: #cbd5e1; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .flow { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#arrow); }
    .flow.alt { stroke: #dc2626; stroke-dasharray: 6 4; marker-end: url(#arrow-fail); }
    .flow.back { stroke-dasharray: 6 4; }
    .badge { fill: #4f46e5; }
    .badge-text { font-size: 12px; font-weight: 700; fill: #ffffff; }
  </style>

  <rect width="1200" height="840" fill="#ffffff"/>

  <text class="title" x="40" y="52">OrionRelay - verifying a webhook on the receiver</text>
  <text class="subtitle" x="40" y="78">WebhookVerifier.Verify checks the Orion-Signature header in this order and returns the first failure; it never throws.</text>

  <!-- start -->
  <rect class="step" x="150" y="105" width="300" height="70" rx="14"/>
  <text class="code" x="300" y="135" text-anchor="middle">Verify(signatureHeader, body, now)</text>
  <text class="small" x="300" y="157" text-anchor="middle">raw body bytes, exactly as received</text>

  <path class="flow" d="M300,175 L300,203"/>

  <!-- decision 1: shape -->
  <polygon class="decision" points="300,205 420,260 300,315 180,260"/>
  <text class="small" x="300" y="256" text-anchor="middle">header is</text>
  <text class="code" x="300" y="275" text-anchor="middle">t=&lt;unix&gt;,v1=&lt;hex&gt;?</text>

  <path class="flow alt" d="M420,260 L618,260"/>
  <text class="edge" x="519" y="251" text-anchor="middle">no</text>
  <rect class="fail" x="620" y="228" width="540" height="64" rx="14"/>
  <text class="code" x="890" y="255" text-anchor="middle">WebhookVerificationFailure.Malformed</text>
  <text class="small" x="890" y="276" text-anchor="middle">missing segment, bad timestamp, MAC not 64 lowercase hex characters</text>

  <path class="flow" d="M300,315 L300,353"/>
  <text class="edge" x="312" y="339">yes</text>

  <!-- decision 2: freshness -->
  <polygon class="decision" points="300,355 420,410 300,465 180,410"/>
  <text class="small" x="300" y="406" text-anchor="middle">|now - t| within</text>
  <text class="code" x="300" y="425" text-anchor="middle">tolerance?</text>

  <path class="flow alt" d="M420,410 L618,410"/>
  <text class="edge" x="519" y="401" text-anchor="middle">no</text>
  <rect class="fail" x="620" y="378" width="540" height="64" rx="14"/>
  <text class="code" x="890" y="405" text-anchor="middle">WebhookVerificationFailure.StaleTimestamp</text>
  <text class="small" x="890" y="426" text-anchor="middle">too old (a replay) or too far ahead; default tolerance 5 minutes</text>

  <path class="flow" d="M300,465 L300,498"/>
  <text class="edge" x="312" y="487">yes</text>

  <!-- recompute -->
  <rect class="step" x="150" y="500" width="300" height="70" rx="14"/>
  <text class="label" x="300" y="528" text-anchor="middle">Recompute HMAC-SHA256</text>
  <text class="small" x="300" y="550" text-anchor="middle">over "&lt;t&gt;.&lt;body&gt;" with the shared secret</text>

  <path class="flow" d="M300,570 L300,598"/>

  <!-- decision 3: match -->
  <polygon class="decision" points="300,600 420,655 300,710 180,655"/>
  <text class="small" x="300" y="651" text-anchor="middle">MACs equal?</text>
  <text class="code" x="300" y="670" text-anchor="middle">FixedTimeEquals</text>

  <path class="flow alt" d="M420,655 L618,655"/>
  <text class="edge" x="519" y="646" text-anchor="middle">no</text>
  <rect class="fail" x="620" y="623" width="540" height="64" rx="14"/>
  <text class="code" x="890" y="650" text-anchor="middle">WebhookVerificationFailure.SignatureMismatch</text>
  <text class="small" x="890" y="671" text-anchor="middle">wrong secret, or the body or timestamp was changed</text>

  <path class="flow" d="M300,710 L300,743"/>
  <text class="edge" x="312" y="732">yes</text>

  <!-- success -->
  <rect class="ok" x="150" y="745" width="300" height="64" rx="14"/>
  <text class="code" x="300" y="773" text-anchor="middle">IsValid = true</text>
  <text class="small" x="300" y="794" text-anchor="middle">authentic and fresh: process the event</text>

  <!-- note -->
  <rect class="note" x="620" y="745" width="540" height="64" rx="10"/>
  <text class="small" x="640" y="771">The sender side is WebhookSigner, used by the dispatcher on every attempt.</text>
  <text class="small" x="640" y="792">Both compute over the same internal SignatureScheme, so they cannot drift.</text>
</svg>
